name: Build Eden Mali X7 Pro

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    name: Native Mali-G720 compute build
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Check out the build definition
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android build components
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail

      - name: Install native build prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes ccache clang glslang-tools lld ninja-build pkg-config

      - name: Fetch the reviewed Eden source revision
        shell: bash
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/eden-emulator/mirror.git eden
          git -C eden fetch --depth 1 origin 5d150cac5c6624fa6a0e94266846b75d91a6a5d0
          git -C eden checkout --detach FETCH_HEAD
          git -C eden submodule update --init --recursive --depth 1

      - name: Apply the X7 Pro native renderer
        shell: bash
        run: bash scripts/apply_x7pro_native.sh "$GITHUB_WORKSPACE/eden"

      - name: Validate Build19 and Build21 policy/integration guardrails
        shell: bash
        run: |
          clang++ -std=c++20 -O2 -Wall -Wextra -Werror -I eden/src tests/build19_policy.cpp -o /tmp/build19-policy-test
          /tmp/build19-policy-test
          clang++ -std=c++20 -O2 -Wall -Wextra -Werror -I tests/stubs -I eden/src tests/build21_policy.cpp -o /tmp/build21-policy-test
          /tmp/build21-policy-test
          python3 tests/validate_build19.py eden
          python3 tests/validate_build21.py eden

      - name: Build independent Mali X7 Pro APK
        # Keep policy validation separate from Android compilation and hardware benchmarks.
        shell: bash
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
          CCACHE: 'true'
        run: |
          set +e
          bash scripts/build_x7pro_native.sh "$GITHUB_WORKSPACE/eden" 2>&1 | tee /tmp/build21-android.log
          status=${PIPESTATUS[0]}
          set -e
          if (( status != 0 )); then
            # Keep compiler diagnostics visible through the Checks API even when the runner's raw
            # log storage is unavailable to a reviewer.
            summary="$(grep -E '(^|[[:space:]])(error:|fatal error:)|FAILED|What went wrong|Execution failed' /tmp/build21-android.log | tail -80 || true)"
            summary="${summary//'%'/'%25'}"
            summary="${summary//$'\r'/'%0D'}"
            summary="${summary//$'\n'/'%0A'}"
            echo "::error title=Android ARM64 build failed::${summary:-See the Build independent Mali X7 Pro APK step log.}"
            exit "$status"
          fi

      - name: Verify package and native payload
        shell: bash
        run: |
          mkdir -p dist
          apk="$(find eden/artifacts -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -F "package: name='org.eden.mali.x7pro'"
          unzip -l "$apk" | grep -F 'lib/arm64-v8a/libyuzu-android.so'
          ! unzip -l "$apk" | grep -Fqi 'lossless.dll'
          cp "$apk" dist/Eden-Mali-X7Pro.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Eden-Mali-X7Pro-${{ github.run_number }}
          path: dist/Eden-Mali-X7Pro.apk
          if-no-files-found: error
          retention-days: 90
