name: Build X7NX Experimental APK

on:
  push:
    branches: [x7nx-phase1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android ARM64 build
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_BASEDIR: ${{ github.workspace }}

    steps:
      - name: Check out X7NX
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore native compiler cache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: x7nx-arm64-ndk28-${{ github.sha }}
          restore-keys: x7nx-arm64-ndk28-

      - name: Install Android build components
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358"
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail

      - name: Install native prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes ccache clang glslang-tools lld ninja-build pkg-config libboost-dev
          python3 -m pip install --user 'cmake==3.31.6'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Validate X7NX phase 1 contracts
        shell: bash
        run: |
          python3 tests/validate_x7nx_phase1.py
          python3 tests/validate_x7nx_backend.py
          python3 tests/validate_x7nx_framebuffer.py
          python3 tests/validate_x7nx_native_fetch.py
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -Isrc tests/x7nx_render_targets.cpp -o /tmp/x7nx-render-targets-test
          /tmp/x7nx-render-targets-test

      - name: Test real shader IR transformations on host
        shell: bash
        run: |
          curl --fail --location --retry 3 https://codeload.github.com/fmtlib/fmt/zip/refs/tags/12.1.0 -o /tmp/x7nx-fmt.zip
          echo 'e6a2b43c6ec4779fb53b15b705f7c20b4eb9d5ae35784d610ac6daec30737019  /tmp/x7nx-fmt.zip' | sha256sum -c -
          unzip -q /tmp/x7nx-fmt.zip -d /tmp/x7nx-host-deps
          sh tests/x7nx_host/run.sh /tmp/x7nx-host-deps/fmt-12.1.0/include /usr/include /tmp/x7nx-host-tests

      - name: Build standalone X7NX APK
        shell: bash
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          CCACHE: 'true'
        run: |
          cd src/android
          chmod +x ./gradlew
          ./gradlew copyX7nxReleaseOutputs \
            -Dorg.gradle.caching=true \
            -Dorg.gradle.parallel=true \
            -PYUZU_ANDROID_ARGS="-DUSE_CCACHE=true" \
            --stacktrace

      - name: Verify APK identity
        shell: bash
        run: |
          apk="$(find artifacts -maxdepth 1 -type f -name 'app-x7nx-release.apk' -print -quit)"
          test -n "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -F "package: name='org.x7nx.emulator'"
          if "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -q 'application-debuggable'; then
            echo 'Refusing a debuggable APK'; exit 1
          fi
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          unzip -l "$apk" | grep -F 'lib/arm64-v8a/libyuzu-android.so'
          mkdir -p dist
          cp "$apk" dist/X7NX-Experimental.apk
          (cd dist && sha256sum X7NX-Experimental.apk > SHA256SUMS.txt)

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: X7NX-Experimental-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90

      - name: Save native compiler cache even after compiler failure
        if: always() && !cancelled()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: x7nx-arm64-ndk28-${{ github.sha }}
